<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyLazer Space Ship</title>
  <script src="canvas.methods.js" type="module"></script>
  <script src="index.js" type="module"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030303;
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    .section-block {
      padding-top: 40px;
      padding-bottom: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      margin-top: 10px;
      margin-left: auto;
      margin-right: auto;
    }

    .mainCanvas {
      margin-top: 50px;
      background-color: black;
    }

    .title {
      text-align: center;
      color: #FF11FF;
      font-family: "Orbitron", sans-serif;
      font-optical-sizing: auto;
    }

    .img-resources {
      display: none;
      visibility: hidden;
    }

    .div-buttons {
      padding: 10px;
    }

    .test-button {
      background-color: #FF11FF;
      color: #ffffff;
      border: 0;
      border-radius: 5px;
      text-transform: uppercase;
      padding: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-button:hover {
      background-color: #a71ba7;
    }

    .profile-container {
      display: flex;
      background-color: #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
      max-width: 600px;
      width: 100%;
    }

    .profile-image {
      flex: 1;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-image img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #4caf50;
      transition: transform 0.3s ease;
    }

    .profile-image img:hover {
      transform: rotate(5deg) scale(1.05);
    }

    .profile-info {
      flex: 2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile-info h1 {
      font-size: 1.8rem;
      margin: 0;
      color: #ffffff;
    }

    .profile-info h2 {
      font-size: 1.2rem;
      color: #aaaaaa;
      margin: 8px 0 20px;
    }

    .social-icons {
      display: flex;
      gap: 16px;
    }

    .social-icons a {
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    .social-icon-svg {
      width: 50px;
    }
  </style>
</head>

<body>
  <div class="section-block">
    <div class="container">
      <canvas class="mainCanvas" id="canvas" width="900" height="600"></canvas>
      <div class="div-buttons" id="develop-buttons" style="display: none;">
        <button class="test-button" id="btn-add-enemy">Add Enemy</button>
      </div>
    </div>
  </div>
  <img class="img-resources" src="./resources/heartgame.png" id="heart">
  <img class="img-resources" src="./resources/main-spaceship0.png" id="spaceship-1">
  <img class="img-resources" src="./resources/main-spaceship1.png" id="spaceship-2">
  <img class="img-resources" src="./resources/main-spaceship2.png" id="spaceship-3">
  <img class="img-resources" src="./resources/enemy.png" id="spaceship-enemy">
  <img class="img-resources" src="./resources/shoot-1.png" id="shoot-1">
  <img class="img-resources" src="./resources/shoot-2.png" id="shoot-2">
  <img class="img-resources" src="./resources/shoot-3.png" id="shoot-3">
  <img class="img-resources" src="./resources/special-shoot-1.png" id="special-shoot-1">
  <img class="img-resources" src="./resources/special-shoot-2.png" id="special-shoot-2">
  <img class="img-resources" src="./resources/special-shoot-3.png" id="special-shoot-3">
  <img class="img-resources" src="./resources/explosion-1.png" id="explosion-1">
  <img class="img-resources" src="./resources/explosion-2.png" id="explosion-2">
  <img class="img-resources" src="./resources/explosion-3.png" id="explosion-3">
  <img class="img-resources" src="./resources/charge-panel-0.png" id="charge-panel-0">
  <img class="img-resources" src="./resources/charge-panel-1.png" id="charge-panel-1">
  <img class="img-resources" src="./resources/charge-panel-2.png" id="charge-panel-2">
  <img class="img-resources" src="./resources/charge-panel-3.png" id="charge-panel-3">
  <img class="img-resources" src="./resources/charge-panel-4.png" id="charge-panel-4">
  <img class="img-resources" src="./resources/charge-panel-particles-0.png" id="charge-panel-particles-0">
  <img class="img-resources" src="./resources/charge-panel-particles-1.png" id="charge-panel-particles-1">
  <img class="img-resources" src="./resources/charge-panel-particles-2.png" id="charge-panel-particles-2">
  <img class="img-resources" src="./resources/charge-panel-particles-3.png" id="charge-panel-particles-3">
  <img class="img-resources" src="./resources/charge-panel-particles-4.png" id="charge-panel-particles-4">
  <div class="section-block">
    <div class="container">
      <div class="profile-container">
        <div class="profile-image">
          <img src="https://avatars.githubusercontent.com/u/49298395?v=4" alt="Foto de perfil GitHub">
        </div>
        <div class="profile-info">
          <h1>Lucas Vinícius de Lima Bezerra</h1>
          <h2>Java Developer | Spring | Angular</h2>
          <div class="social-icons">
            <a href="https://github.com/LucasViniciusLima" target="_blank">
              <img class="social-icon-svg" src="./resources/social-icons/icons8-github.svg" />
            </a>
            <a href="https://www.linkedin.com/in/lucas-bezerra-a06656186/" target="_blank">
              <img class="social-icon-svg" src="./resources/social-icons/icons8-linkedin.svg" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
